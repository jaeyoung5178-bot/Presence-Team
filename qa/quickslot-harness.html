<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presence Quick Access QA</title>
<link rel="stylesheet" href="../assets/presence-avatar-studio.css">
<style>
  :root{--cream:#f7f2e9;--muted:#8fa0b6;--card:#142031;--sans:system-ui,sans-serif;--disp:system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1522;color:var(--cream);font-family:var(--sans)}
  #m-home{display:block}.wrap{width:min(1120px,calc(100% - 32px));margin:40px auto;position:relative}
  .hero{min-height:310px;border:1px solid #263b57;border-radius:28px;background:linear-gradient(135deg,#17253a,#101b2b);padding:34px}
  .hero h1{margin:0 0 10px}.hero p{margin:0;color:var(--muted)}
</style>
<main id="m-home"><div class="wrap"><section class="hero"><h1>Today</h1><p>홈 콘텐츠는 아래에서 시작하며 검색 팝오버와 간섭하지 않아야 합니다.</p></section></div></main>
<button id="homeSearchBtn">legacy</button><button id="homeEntryBtn"></button>
<script>
  window.me={uid:'qa-home',name:'QA'};
  window.TABMETA={callback:{l:'콜백싯',e:'▣'},people:{l:'People',e:'👥'},progress:{l:'Progress',e:'↗'},profit:{l:'Profit',e:'₩'},oneonone:{l:'1 on 1',e:'▦'},inventory:{l:'Avatar Studio',e:'🐥'}};
  window.tabVisible=function(){return true};window.goTab=function(k){document.title='OPEN '+k};window.hsSearch=function(q){q=q.toLowerCase();return Object.keys(TABMETA).filter(function(k){return TABMETA[k].l.toLowerCase().indexOf(q)>=0}).map(function(k){return{k:k}})};
</script>
<script src="../assets/presence-home-quickslots.js"></script>
<script>
  setTimeout(function(){
    if(window.openQuickslotPicker)window.openQuickslotPicker();
    setTimeout(function(){
      var search=document.querySelector('.hqd-search').getBoundingClientRect();
      var launch=document.querySelector('.hqd-launch').getBoundingClientRect();
      var pop=document.querySelector('.hqd-popover').getBoundingClientRect();
      var add=document.querySelector('.hqd-add'),options=document.querySelectorAll('.qsm-option');
      var noOverlap=search.right<=launch.left+1&&pop.right<=innerWidth+1&&pop.left>=-1;
      document.title=(noOverlap&&add&&options.length===6?'PASS':'FAIL')+' quick-access '+Math.round(search.width)+'px / '+options.length+' options';
    },260);
  },800);
</script>
</html>
